<style>
:root {
  --green:#286f38; --lime:#93ba34; --ink:#20251f;
  --muted:#60675f; --line:#dce4d8; --paper:#fffefb;
}
* { box-sizing:border-box; }
button,a { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
body {
  margin:0;
  background:linear-gradient(145deg,#f8faf5,#e8eee4);
  font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  color:var(--ink);
}
.wrap { width:min(100%,540px); margin:auto; padding:16px 14px calc(38px + env(safe-area-inset-bottom)); }
.card {
  overflow:hidden;
  border:1px solid #d8e2d4;
  border-radius:24px;
  background:var(--paper);
  box-shadow:0 18px 50px rgba(35,60,31,.14);
}
.brand {
  padding:20px 22px 17px;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.logo {
  display:block;
  width:min(76%,350px);
  height:auto;
  margin:0;
  object-fit:contain;
  object-position:left center;
}
.company-caption {
  margin:10px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}
.person {
  padding:25px 22px 23px;
  background:linear-gradient(150deg,#fff,#f2f6e9);
  border-bottom:1px solid var(--line);
}
.business {
  margin:18px 0 0;
  padding:13px 14px;
  border-left:5px solid var(--lime);
  border-radius:0 12px 12px 0;
  background:#f5f8ef;
  font-size:17px;
  font-weight:850;
  line-height:1.5;
}
.role {
  display:inline-block;
  padding:6px 11px;
  border-radius:999px;
  background:#e8f0dc;
  color:var(--green);
  font-size:15px;
  font-weight:850;
}
h1 {
  margin:10px 0 0;
  font-size:38px;
  letter-spacing:-.04em;
  line-height:1.12;
}
.actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  padding:20px 22px 10px;
}
.action {
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  color:var(--ink);
  text-decoration:none;
  font-size:18px;
  font-weight:850;
}
.action.primary { background:var(--green); border-color:var(--green); color:white; }
.action.full { grid-column:1/-1; }
.savebox {
  margin:10px 22px 6px;
  padding:18px;
  border:1px solid #d7e3d0;
  border-radius:17px;
  background:#f0f6e9;
}
.savebox h2 { margin:0 0 8px; font-size:22px; }
.savebox p { margin:0 0 14px; color:var(--muted); font-size:16px; line-height:1.65; }
.savebtn {
  width:100%;
  min-height:64px;
  border:0;
  border-radius:15px;
  background:#202720;
  color:#fff;
  font-size:19px;
  font-weight:900;
}.status {
  display:none;
  margin-top:11px;
  padding:12px;
  border-radius:11px;
  background:#fff;
  color:#555e54;
  font-size:15px;
  line-height:1.6;
}
.details { padding:12px 22px 25px; }
.row {
  display:grid;
  grid-template-columns:88px 1fr;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid #edf0e9;
  font-size:17px;
  line-height:1.6;
}
.label { color:var(--muted); font-size:15px; font-weight:800; }
.value { word-break:break-all; }
.map {
  display:block;
  margin-top:15px;
  padding:16px;
  border-radius:14px;
  background:#eef4e8;
  color:var(--green);
  font-size:17px;
  font-weight:900;
  text-align:center;
  text-decoration:none;
}
.foot { margin:14px 4px 0; text-align:center; color:#777e76; font-size:13px; }

@media (min-width: 900px) {
  body {
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:28px;
  }

  .wrap {
    width:min(1180px, 100%);
    padding:0;
  }

  .card {
    display:grid;
    grid-template-columns:minmax(420px, 0.95fr) minmax(500px, 1.05fr);
    grid-template-areas:
      "brand actions"
      "person save"
      "person details";
    align-items:stretch;
    border-radius:28px;
    overflow:hidden;
    min-height:680px;
  }

  .brand {
    grid-area:brand;
    padding:34px 34px 28px;
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);
  }

  .logo {
    width:min(88%, 410px);
  }

  .company-caption {
    margin-top:14px;
    font-size:14px;
  }

  .person {
    grid-area:person;
    padding:34px;
    border-bottom:0;
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
  }

  .role {
    align-self:flex-start;
  }

  h1 {
    font-size:52px;
    margin-top:14px;
  }

  .business {
    margin-top:24px;
    font-size:20px;
  }

  .actions {
    grid-area:actions;
    padding:32px 34px 14px;
    grid-template-columns:repeat(3, 1fr);
  }

  .action,
  .action.full {
    grid-column:auto;
    min-height:66px;
    font-size:18px;
  }

  .savebox {
    grid-area:save;
    margin:10px 34px 10px;
    padding:20px;
  }

  .details {
    grid-area:details;
    padding:8px 34px 30px;
  }

  .row {
    grid-template-columns:100px 1fr;
    font-size:17px;
  }

  .foot {
    margin-top:16px;
  }
}

@media(max-width:480px) {
  .wrap { padding:0; }
  .card {
    border-left:0;
    border-right:0;
    border-radius:0;
    box-shadow:none;
  }
  .brand { padding:18px 18px 15px; }
  .logo { width:min(82%,330px); }
  .company-caption { font-size:12px; }
  .business { font-size:17px; }
  .person { padding:23px 18px 21px; }
  h1 { font-size:36px; }
  .actions { padding:18px 18px 8px; }
  .savebox { margin:10px 18px 6px; }
  .details { padding:12px 18px 24px; }
}
@media(max-width:370px) {
  h1 { font-size:34px; }
  .actions { grid-template-columns:1fr; }
  .action.full { grid-column:auto; }
  .row { grid-template-columns:78px 1fr; font-size:16px; }
}
</style>
</head>

  setTimeout(() => URL.revokeObjectURL(url), 15000);
});
</script>
